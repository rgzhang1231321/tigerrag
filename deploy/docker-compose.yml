name: tigerrag

# All service data and configuration files are bind-mounted under a single
# root controlled by DATA_ROOT (for runtime data) and CONFIG_ROOT (for
# static config files like nginx.conf). They share one directory tree:
#
#   $DATA_ROOT/
#     postgres/                # postgres cluster root (mounted at /var/lib/postgresql)
#     redis/                   # redis append-only file
#     qdrant/                  # qdrant storage
#     minio/                   # minio data
#
#   $CONFIG_ROOT/
#     nginx.conf               # gateway (nginx) config
#
# Defaults are ./data and ./config relative to this compose file. On hosts
# where the working directory is on a filesystem that does not support
# POSIX permissions or proper file-type detection for bind mounts (e.g.
# WSL with the project mounted from /mnt/c, /mnt/d via DrvFS/9P), override
# these in .env to point at native ext4 paths.
#
# Run `deploy/deploy.sh` (or `cd deploy && docker compose ...`) so that the
# relative paths below resolve correctly.

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "8099:80"
    volumes:
      - ${CONFIG_ROOT:-./config}/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started

  admin:
    build:
      context: ../frontend/tigerrag-admin
    ports:
      - "5173:80"

  api:
    build:
      context: ..
      dockerfile: src/TigerRAG.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: src/TigerRAG.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${DATA_ROOT:-./data}/qdrant:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    restart: unless-stopped
